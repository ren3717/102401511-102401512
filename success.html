<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发布成功 · 校园失物招领</title>
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="app-header"></header>

<main>
  <div class="wrap">
    <div class="success-wrap">

      <div class="success-icon">✓</div>
      <h1>发布成功！</h1>
      <p>你的信息已经发布，其他同学可以在首页或搜索页看到它</p>

      <div class="success-card" id="preview-card"></div>

      <div class="success-actions">
        <a class="btn btn-primary btn-lg" id="btn-detail" href="mine.html">查看这条信息</a>
        <a class="btn btn-ghost btn-lg" href="mine.html">我的发布</a>
        <a class="btn btn-ghost btn-lg" href="index.html">返回首页</a>
      </div>

      <p style="margin-top:22px;font-size:13px;color:#8F959E;">
        找回或归还物品后，记得在「我的发布」里把状态标记为已找到 / 已归还
      </p>

    </div>
  </div>
</main>

<footer id="app-footer"></footer>

<script src="js/utils.js"></script>
<script src="js/store.js"></script>
<script src="js/seed.js"></script>
<script src="js/ui.js"></script>
<script>
(function () {
  'use strict';
  document.addEventListener('DOMContentLoaded', function () {
    LFUI.initPage('');

    var id = LFUtils.parseQuery(location.search).id;
    var item = id ? LFUI.store.getById(id) : null;
    var box = document.getElementById('preview-card');

    if (!item) {
      box.innerHTML = '<p style="color:#8F959E;text-align:center;">' +
        '未找到刚发布的信息（可能已被删除）。你可以到「我的发布」看看全部记录。</p>';
      document.getElementById('btn-detail').href = 'mine.html';
      return;
    }

    // 预览刚发布的那条信息
    box.innerHTML =
      '<div style="display:flex;gap:12px;align-items:center;">' +
        LFUI.thumbHtml(item, 'card-thumb') +
        '<div style="flex:1;min-width:0;">' +
          '<div style="font-weight:700;font-size:15.5px;margin-bottom:6px;">' + LFUtils.escapeHtml(item.title) + '</div>' +
          '<div class="card-tags">' +
            '<span class="tag ' + LFUI.typeClass(item) + '">' + LFUI.typeText(item) + '</span>' +
            '<span class="tag tag-cat">' + LFUI.categoryName(item.category) + '</span>' +
          '</div>' +
          '<div class="card-meta"><span>📍 ' + LFUtils.escapeHtml(item.place) + '</span>' +
          '<span>🕐 ' + LFUtils.formatTime(item.time) + '</span></div>' +
        '</div>' +
      '</div>';

    document.getElementById('btn-detail').href = 'detail.html' + LFUtils.buildQuery({ id: item.id });
  });
})();
</script>
</body>
</html>
